# Dev-only tooling the security scan cannot fix yet. Each entry is pinned to the
# exact version in package-lock.json, so an upgrade scans it again, and expires
# on 2027-02-01 so it is looked at again either way.

# These come only from @vercel/node, which the API imports for types alone. Even its
# latest release pins these versions, so there is no upgrade to take yet.
[[PackageOverrides]]
name = "undici"
version = "5.28.4"
ecosystem = "npm"
ignore = true
effectiveUntil = 2027-02-01
reason = "Only in @vercel/node, used for types; its latest release still pins this version"

[[PackageOverrides]]
name = "path-to-regexp"
version = "6.1.0"
ecosystem = "npm"
ignore = true
effectiveUntil = 2027-02-01
reason = "Only in @vercel/node, used for types; its latest release still pins this version"

[[PackageOverrides]]
name = "@fastify/busboy"
version = "2.1.1"
ecosystem = "npm"
ignore = true
effectiveUntil = 2027-02-01
reason = "Only in @vercel/node (through undici), used for types; no fixed release in its tree yet"
