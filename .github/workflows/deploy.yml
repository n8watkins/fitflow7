# Deploys the Worker (the app and its API) to Cloudflare after every push to
# main, the same `npm run deploy` that ships it by hand. Only main deploys:
# release/* branches and pull requests never do. It needs a
# CLOUDFLARE_API_TOKEN repository secret (an API token with the "Edit
# Cloudflare Workers" permission); until that exists the job says so and
# passes without deploying.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'n8watkins/fitflow7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. Add the repository secret to deploy from GitHub."

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
