name: CI

# Verifies every push to main and every PR with the same pipeline used locally:
# type-check + lint + tests + production build, a dry-run bundle of the Worker,
# plus the MCP server's type-check.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Worker types match wrangler.jsonc
        run: npx wrangler types worker-configuration.d.ts --check

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir "${{ runner.temp }}/worker-bundle"

      - name: MCP type-check
        working-directory: mcp
        run: |
          npm ci
          npm run typecheck
